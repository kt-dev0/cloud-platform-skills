<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Cloud Platform Skills: AI agent skills for cloud platform engineering">
  <defs>
    <linearGradient id="bcanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1023"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bcanvas)"/>
  <rect width="1280" height="360" fill="url(#bgrid)"/>
  <rect width="1280" height="360" fill="url(#bglow)"/>
  <svg x="72" y="68" width="224" height="224" viewBox="0 0 256 256"><defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="blayer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#bbg)"/>

  <g transform="translate(0 10)">
  <!-- cloud -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="128" r="38"/>
    <circle cx="140" cy="106" r="50"/>
    <circle cx="184" cy="136" r="32"/>
    <rect x="58" y="128" width="158" height="54" rx="27"/>
  </g>

  <!-- platform layers (isometric stack) -->
  <g fill="none" stroke="url(#blayer)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M137 108 L169 124 L137 140 L105 124 Z" fill="url(#blayer)" stroke="none"/>
    <path d="M105 139 L137 155 L169 139"/>
    <path d="M105 156 L137 172 L169 156" opacity="0.55"/>
  </g>

  </g>

  <!-- AI sparkle -->
  <path fill="#FFFFFF" d="M206 34 C208 52 214 58 232 60 C214 62 208 68 206 86 C204 68 198 62 180 60 C198 58 204 52 206 34 Z"/>
  <path fill="#FFFFFF" opacity="0.85" d="M178 22 C179 30 182 33 190 34 C182 35 179 38 178 46 C177 38 174 35 166 34 C174 33 177 30 178 22 Z"/>
</svg>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="340" y="150" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Cloud Platform Skills</text>
    <text x="340" y="199.4" font-size="26" fill="#C7D2FE">AI agent skills for cloud platform engineering,</text>
    <text x="340" y="234.5" font-size="26" fill="#C7D2FE">aligned to the Well-Architected Framework.</text>
    <rect x="340" y="268" width="82" height="40" rx="20.0" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="381.0" y="294.48" font-size="18" text-anchor="middle" fill="#E0E7FF">Azure</text><rect x="434" y="268" width="61" height="40" rx="20.0" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="464.5" y="294.48" font-size="18" text-anchor="middle" fill="#E0E7FF">AWS</text><rect x="507" y="268" width="158" height="40" rx="20.0" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="586.0" y="294.48" font-size="18" text-anchor="middle" fill="#E0E7FF">Google Cloud</text><rect x="677" y="268" width="158" height="40" rx="20.0" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="756.0" y="294.48" font-size="18" text-anchor="middle" fill="#E0E7FF">Oracle Cloud</text>
  </g>
</svg>
